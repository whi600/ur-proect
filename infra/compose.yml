name: pravo-orbita

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    env_file:
      - ../backend/.env
    ports:
      # PostgreSQL is intentionally unavailable to Wi-Fi and the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 stores its cluster under this mount point.
      - legal_orbit_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  legal_orbit_postgres_data:
